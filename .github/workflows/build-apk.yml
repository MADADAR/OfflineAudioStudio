name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        required: true
        default: "main"
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Run audio quality unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Create one-time release signing key
        shell: bash
        run: |
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/sonicdemixer-release.jks" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias sonicdemixer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SonicDemixer, OU=Android, O=OfflineAudioStudio, L=Unknown, ST=Unknown, C=CA"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sonicdemixer-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=sonicdemixer"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicDemixer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
